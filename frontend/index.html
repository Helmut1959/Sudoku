<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Sudoku — Denkpause</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Sudoku Startseite"><span class="brand-mark">▦</span> H Games <span class="brand-dot">.</span></a>
      <div class="top-note"><span class="status-dot"></span> Dein tägliches Gehirntraining</div>
    </header>

    <section class="hero">
      <div>
        <p class="eyebrow">  </p>
        <h1>Ein Feld voller<br><span>Möglichkeiten.</span></h1>
        <p class="intro">Los geht's!</p>
      </div>
      <div class="hero-art" aria-hidden="true"><div class="mini-grid">
        <i>4</i><i></i><i>8</i><i></i><i>2</i><i></i><i>7</i><i></i><i>1</i>
      </div><span class="sparkle">✦</span></div>
    </section>

    <section class="game-card">
      <div class="game-toolbar">
        <div class="difficulty-wrap">
          <span class="toolbar-label">SCHWIERIGKEIT</span>
          <div class="difficulty" role="group" aria-label="Schwierigkeitsgrad">
            <button class="level active" data-level="leicht">Leicht</button>
            <button class="level" data-level="mittel">Mittel</button>
            <button class="level" data-level="schwer">Schwer</button>
          </div>
        </div>
        <div class="timer-box"><span class="toolbar-label">DEINE ZEIT</span><strong id="timer">00:00</strong></div>
      </div>

      <div class="board-wrap">
        <div id="board" class="sudoku-board" role="grid" aria-label="Sudoku Spielfeld"></div>
      </div>

      <div class="number-pad" aria-label="Zahlen eingeben">
        <button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button>
        <button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button>
        <button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button>
        <button data-number="0" class="erase" aria-label="Löschen">⌫</button>
      </div>

      <div class="game-actions">
        <button id="checkBtn" class="button secondary">✓ Eingaben prüfen</button>
        <button id="newBtn" class="button primary"><span>↻</span> Neues Sudoku</button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite">Wähle ein Feld und trage eine Zahl ein.</p>
    </section>
    <footer>Eine kleine Denkpause für dich <span>✦</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
